[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# The URL is resolved at runtime from BIDPROOF_DATABASE_URL (falling back to the SQLite file
# under BIDPROOF_DATA_ROOT), so it is intentionally not duplicated here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
