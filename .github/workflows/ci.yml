name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BIDPROOF_ENV: test
      BIDPROOF_ALLOW_TRUSTED_HEADERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Workflow state check
        run: python -m app.workflow check
      - name: JavaScript syntax check
        run: node --check static/app.js && node --check static/landing.js
      - name: Run tests
        run: pytest -q
