apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bidproof.name" . }}
  labels:
    {{- include "bidproof.labels" . | nindent 4 }}
type: Opaque
stringData:
  BIDPROOF_DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "bidproof.name" .) .Values.postgresql.auth.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  BIDPROOF_BOOTSTRAP_TOKEN: {{ .Values.bootstrapToken | default "" | quote }}
  BIDPROOF_LICENSE_KEY: {{ .Values.licenseKey | default "" | quote }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bidproof.name" . }}
  labels:
    {{- include "bidproof.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bidproof.name" . }}-postgres
  labels:
    {{- include "bidproof.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "bidproof.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bidproof.name" . }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bidproof.name" . }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bidproof.name" . }}
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bidproof.name" . }}-postgres
spec:
  selector:
    app.kubernetes.io/name: {{ include "bidproof.name" . }}
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
