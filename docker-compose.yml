# Single-host deployment. Only Caddy is exposed; database and application stay private.
x-app-environment: &app-environment
  BIDPROOF_ENV: production
  BIDPROOF_DATA_ROOT: /data
  BIDPROOF_DATABASE_URL: postgresql+psycopg://bidproof:${POSTGRES_PASSWORD:?set a random hex POSTGRES_PASSWORD}@postgres:5432/bidproof
  BIDPROOF_PUBLIC_ORIGIN: ${BIDPROOF_PUBLIC_ORIGIN:?set the HTTPS public origin}
  BIDPROOF_DATA_REGION: ${BIDPROOF_DATA_REGION:-deployment-defined}
  BIDPROOF_ALLOWED_HOSTS: ${BIDPROOF_DOMAIN:?set the public domain},127.0.0.1,localhost
  BIDPROOF_TRUSTED_PROXY_IPS: ${BIDPROOF_PROXY_IP:-172.30.64.2}
  BIDPROOF_JOB_RUNNER: worker
  BIDPROOF_JOB_TIMEOUT_SECONDS: "600"
  BIDPROOF_JOB_STALE_SECONDS: "900"
  BIDPROOF_JOB_POLL_SECONDS: "1"
  BIDPROOF_MAX_REQUEST_BYTES: "115343360"
  BIDPROOF_MAX_UPLOAD_BYTES: "52428800"
  BIDPROOF_MAX_EVIDENCE_FILES: "20"
  BIDPROOF_MAX_PDF_PAGES: "500"
  BIDPROOF_DB_POOL_SIZE: "5"
  BIDPROOF_DB_MAX_OVERFLOW: "5"
  BIDPROOF_JSON_LOGS: "1"
  BIDPROOF_METRICS: "0"
  BIDPROOF_ALLOW_TRUSTED_HEADERS: "0"
  BIDPROOF_TRIAL_JOIN_CODE: ""
  BIDPROOF_PERSONAL_SIGNUP: ${BIDPROOF_PERSONAL_SIGNUP:-0}
  BIDPROOF_BOOTSTRAP_TOKEN: ${BIDPROOF_BOOTSTRAP_TOKEN:?set a random initial-admin bootstrap token}
  BIDPROOF_OCR_EGRESS_ALLOWED: "0"
  BIDPROOF_FIELD_ENCRYPTION_KEY: ${BIDPROOF_FIELD_ENCRYPTION_KEY:?set and securely back up the field encryption key}

x-app: &app
  image: bidproof:${BIDPROOF_IMAGE_TAG:-production-local}
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-environment
  volumes:
    - bidproof-data:/data
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: 160
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bidproof
      POSTGRES_USER: bidproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a random hex POSTGRES_PASSWORD}
    volumes:
      - bidproof-postgres:/var/lib/postgresql/data
    networks: [backend]
    shm_size: 128mb
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 160
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bidproof -d bidproof']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *app
    command: [python, -m, app.dbctl, upgrade]
    networks: [backend]
    mem_limit: 512m
    cpus: 0.5
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    networks: [edge, backend]
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: [python, -m, app.worker]
    networks: [backend]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -m, app.worker, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      BIDPROOF_DOMAIN: ${BIDPROOF_DOMAIN:?set the public domain}
      ACME_EMAIL: ${ACME_EMAIL:?set a certificate contact email}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${BIDPROOF_PROXY_IP:-172.30.64.2}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: ${BIDPROOF_PROXY_SUBNET:-172.30.64.0/29}
  backend:
    internal: true

volumes:
  bidproof-data:
  bidproof-postgres:
  caddy-data:
  caddy-config:
