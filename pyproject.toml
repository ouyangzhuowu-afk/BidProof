[project]
name = "bid-evidence-agent"
version = "0.1.0"
description = "Evidence-grounded bid qualification and fatal-risk scanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx2>=2.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
