[project]
name = "bid-evidence-agent"
version = "0.1.0"
description = "Evidence-grounded bid qualification and fatal-risk scanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "structlog>=24.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ldap = ["ldap3>=2.9"]
# Local OCR: RapidOCR+ONNX preferred on Windows RTX 50-series; Paddle preferred in WSL2/Linux.
# See outputs/LOCAL_OCR_OPTIONS.md
ocr = ["rapidocr-onnxruntime>=1.3", "onnxruntime>=1.17", "pillow>=10", "numpy>=1.24"]
ocr-paddle = ["paddleocr>=2.7", "paddlepaddle>=2.5", "pillow>=10", "numpy>=1.24"]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx2>=2.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
