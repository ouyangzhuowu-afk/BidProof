    <h1>隐私与数据处理说明</h1>
    <p>BidProof 不提供法律意见（not legal advice）。上传的招标文件与企业证据按企业数据处理，访问权限与保留策略由企业管理员配置。</p>
    <p>默认归档保留 365 天（可配置 1–3650 天）。永久删除会移除任务、评论、反馈、作业和上传文件；备份副本需按运维策略单独处理。</p>
    <p>登录仅需用户名与密码（可选企业 SSO / MFA）。产品不强制收集身份证号或手机号。投标材料中如含个人信息，属于客户自带数据。</p>
    <p>当前公网试点数据存储于新加坡（Render）。国内政企交付需另行部署境内节点。</p>
